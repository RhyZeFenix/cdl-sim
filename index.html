<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDL Season Sim</title>
    <meta name="description" content="Call of Duty League season simulator: 2024-2026 seasons, GM mode, live and 3D replays." />
    <meta name="theme-color" content="#121211" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Apply the saved theme before the first paint (no flash).
      try {
        var t = localStorage.getItem("cdl-sim:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        if (localStorage.getItem("cdl-sim:contrast") === "high") document.documentElement.setAttribute("data-contrast", "high");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
